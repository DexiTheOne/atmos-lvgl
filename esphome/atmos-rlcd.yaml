# Frame-pacing benchmark on the real Waveshare ESP32-S3-RLCD-4.2 panel.
# Same as atmos-bench.yaml but with the board's own display pins (Waveshare docs).

esphome:
  name: atmos-rlcd
  on_boot:
    priority: -100
    then:
      - media_player.volume_set:
          id: alert_player
          volume: !lambda "float v = id(alert_volume).state; return (v) <= 0.0f ? 0.0f : (191.0f + 0.6f * ((v) - 100.0f)) / 255.0f;"
      # Audio power-up, during the splash (the UI waits there for the connection):
      # with the amplifier still off, start the keep-alive source (codec and I2S),
      # then the bell's own path, so their start-up pops are unheard; then switch the
      # amplifier on for good.
      - speaker.play:
          id: keepalive_source
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      # The first sound still started the announcement pipeline and its mixer source
      # for the first time (and popped): play the bell once now, unheard, and stop it.
      - media_player.speaker.play_on_device_media_file:
          id: alert_player
          media_file: alert_sound
          announcement: true
      - wait_until:
          condition:
            media_player.is_announcing: alert_player
          timeout: 2s
      - delay: 300ms
      - media_player.stop:
          id: alert_player
          announcement: true
      - wait_until:
          condition:
            media_player.is_idle: alert_player
          timeout: 2s
      - delay: 500ms
      - switch.turn_on: speaker_amp
      - logger.log: "Audio ready: amplifier on"
  # Short build path: ESP-IDF object paths exceed Windows' 260-character limit
  # when long paths are disabled. Also set ESPHOME_ESP_IDF_PREFIX=C:\ESPHome\idf.
  build_path: C:/ESPHome/build/atmos-rlcd

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# Home Assistant. Credentials come from secrets.yaml beside this file (gitignored):
#   wifi_ssid, wifi_password, api_encryption_key (32-byte base64), ota_password.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: ../components

# Waveshare ESP32-S3-RLCD-4.2 display pins.
spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

display:
  - platform: st7305_rlcd
    id: panel
    model: WAVESHARE_400X300
    # 40 MHz: verified clean on this panel (2026-10-30). The driver default is 10 MHz.
    data_rate: 40MHz
    cs_pin: GPIO40
    dc_pin: GPIO5
    reset_pin: GPIO41
    te_pin: GPIO6  # frames at the panel's blank
    auto_clear_enabled: false
    update_interval: never

atmos:
  display_id: panel
  frame_period: 59ms  # about 17 fps cap
  frame_stats: true  # benchmark logs (bench.ps1)
  report_interval: 10s
  # Drop-down of the readings: choosing one moves to its page and underlines/charts it.
  # It follows the display as the keys and automatic cycling move the selection.
  reading_select:
    name: Reading
  # Automatic cycling through the readings (restored after a reboot).
  auto_advance:
    name: Auto Advance
  # While any reading's band alerts, cycling shows only alerting readings (off by default).
  alert_focus:
    name: Alert Focus
  # Alert sounds: the bell plays where cycling enters the alert-focus cycle (needs
  # Alert focus). Readings join the alert set after alerting for alert_enter and
  # leave it after alert_leave clear; badges still show the live rating.
  alert_sound:
    name: Alert Sound
  overview_low_light:  # park on the overview in low light (atmos_led auto_dimming sensor)
    name: Overview in Low Light
  # Device-only rows of the settings page (middle key), each linked to its entity.
  settings:
    alert_volume: alert_volume
    status_leds: status_leds
  alert_enter: 60s
  alert_leave: 3min
  alert_sound_cooldown: 20min  # no repeat sound this soon after a clear
  on_alert_start:
    - script.execute: play_alert
  # on_alert_clear: no clear sound yet.
  # On while the debounced alert set is non-empty.
  alert_active:
    name: Air Quality Alert
  # Seconds each page is held (split between its readings) before moving on.
  # min_value/max_value may narrow the 2-600 s the UI accepts.
  hold_time:
    name: Page Hold Time
    max_value: 120
    initial_value: 6.5
  # Minutes of history the charts show (1-1440). Shrinking it discards older samples;
  # growing it lets the chart fill up to the new span.
  history_time:
    name: History Time
    max_value: 240
    initial_value: 2
  # Data source per reading: the id of any ESPHome sensor (any platform, or a
  # homeassistant sensor). Keys: co2, voc, nox, formaldehyde, pm1, pm2_5, pm4, pm10,
  # temperature, humidity, pressure. Once any is linked the demo data stops and
  # unlinked readings show "--". Expected units: CO2 ppm, VOC/NOx index,
  # formaldehyde ppb, PM ug/m3, temperature degC, humidity %, pressure hPa; convert
  # others with sensor filters (e.g. multiply). Without this block the demo runs.
  # sensors:
  #   co2: my_co2
  #   pm2_5: my_pm25
  #   temperature: my_temperature
  #   pm1: {sensor: my_pm1, startup_delay: true}  # chart waits for the SEN6x start-up
  #   humidity: my_humidity
  # Badge text per reading: the first band whose [min, max) holds the reading wins;
  # leave min or max out for an open end. Any text up to 15 characters. level orders
  # severity (default: the band's position): the overview shows the worst. alert
  # (default: level 2 or more) raises the warning, Air Quality Alert and alert focus. Readings not listed keep the built-in Good/Fair/Poor:
  # co2, voc, nox, formaldehyde, pm1, pm2_5, pm4, pm10, temperature, humidity, pressure.
  ratings:
    co2:
      - {max: 800, text: Good, led_color: "#00FF00"}
      - {min: 800, max: 1200, text: Fair, led_color: "#FFB000"}
      - {min: 1200, max: 2000, text: Poor, led_color: "#FF0000"}
      - {min: 2000, text: Terrible, level: 3, led_color: "#B000FF"}
    temperature:
      - {min: 20, max: 25, text: Good, level: 0}
      - {max: 18, text: Cold, level: 2}
      - {max: 20, text: Cool, level: 1}
      - {max: 27, text: Warm, level: 1}
      - {text: Hot, level: 2}
  # led_color (#RRGGBB) per band sets the status LEDs' colour; without it: level 0
  # green, 1 amber, 2+ red.

# Audio: ES8311 codec (I2C 0x18 for configuration, I2S for samples) and a speaker
# amplifier enabled by GPIO46. Pins from Waveshare's ESPHome example for this board.
# I2C runs at 100 kHz, the SEN6x maximum, so the sensors can share the bus.
i2c:
  id: bus_a
  sda: GPIO13
  scl: GPIO14
  frequency: 100kHz

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

audio_dac:
  - platform: es8311
    id: codec
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: codec
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 100ms  # I2S DMA buffers live in internal RAM, beside the frame buffers
    # Keep I2S clocked between sounds: restarting it pops through the amplifier.
    timeout: never
  # Every sound ends with finish(), which tears I2S down whatever its timeout says.
  # The mixer keeps its output running while any source runs, so keepalive_source
  # (started at boot, never finished, no data) holds I2S and the codec on; the
  # sounds play through alert_source.
  - platform: mixer
    id: audio_mixer
    output_speaker: i2s_speaker
    source_speakers:
      - id: alert_source
      - id: keepalive_source
        timeout: never

# Plays the embedded sounds (esphome/sounds/, 16-bit mono 16 kHz WAV; see
# prepare_sound.py). Internal: Home Assistant gets the Alert Volume number instead.
media_player:
  - platform: speaker
    id: alert_player
    internal: true
    announcement_pipeline:
      speaker: alert_source
      format: WAV
      sample_rate: 16000
      num_channels: 1
    files:
      - id: alert_sound
        file: sounds/alert.wav

# The bell: play, and retry once if the player did not start announcing.
# restart: a new request (e.g. dragging the volume) replaces one in progress.
script:
  - id: play_alert
    mode: restart
    then:
      - media_player.speaker.play_on_device_media_file:
          id: alert_player
          media_file: alert_sound
          announcement: true
      - wait_until:
          condition:
            media_player.is_announcing: alert_player
          timeout: 1s
      - if:
          condition:
            not:
              media_player.is_announcing: alert_player
          then:
            - logger.log: "Alert sound did not start; retrying"
            - media_player.speaker.play_on_device_media_file:
                id: alert_player
                media_file: alert_sound
                announcement: true
            - wait_until:
                condition:
                  media_player.is_announcing: alert_player
                timeout: 1s

switch:
  - platform: gpio
    id: speaker_amp
    internal: true
    # Off at boot; on_boot switches it on once the codec runs, then it stays on
    # (switching it per sound clicked, and it is silent when idle).
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO46
      ignore_strapping_warning: true

number:
  - platform: template
    id: alert_volume
    name: Alert Volume
    icon: mdi:volume-high
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 40
    restore_value: true
    optimistic: true
    # ES8311 volume is 0.5 dB per step, 0.75 = 0 dB, 1.0 = +32 dB (clips). The
    # slider runs -28.5 dB (5 %) to 0 dB (100 %); 0 % is silent.
    on_value:
      - media_player.volume_set:
          id: alert_player
          volume: !lambda "return (x) <= 0.0f ? 0.0f : (191.0f + 0.6f * ((x) - 100.0f)) / 255.0f;"
      # Play the bell at the new volume (not when the saved value is restored at boot).
      - if:
          condition:
            lambda: "return millis() > 10000;"
          then:
            - script.execute: play_alert

# Status LEDs: 4 WS2812B on GPIO2. atmos_led is the Home Assistant light (power and
# brightness only) and sets the colour from the rating on screen, fading out and in
# with each page transition.
light:
  - platform: esp32_rmt_led_strip
    id: status_strip
    internal: true  # colours only; Home Assistant sees the Status LEDs light below
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO2  # not U0TXD: boot UART output flashed the LEDs
    num_leds: 4
    restore_mode: ALWAYS_OFF  # dark until atmos_led sets a colour (on would flash white at boot)

atmos_led:
  id: status_leds
  light_id: status_strip
  reverse: true  # LED 0 is on the right
  name: Status LEDs  # brightness-only light: power and a brightness slider
  default_transition_length: 300ms

# The board's two keys (active low). No touch, so they step the underlined reading
# within a page, then move to the neighbouring page. GPIO0 is also the boot
# strapping pin: holding the right key at reset enters the bootloader.
binary_sensor:
  - platform: gpio
    id: key_left
    internal: true  # no Home Assistant entity
    pin:
      number: GPIO18
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - atmos.previous
  - platform: gpio
    id: key_right
    internal: true  # no Home Assistant entity
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - atmos.next
  # Settings key on GPIO1 (active low, pulled up externally: the pin is input only,
  # no internal pull, so it stays high impedance).
  - platform: gpio
    id: key_settings
    internal: true  # no Home Assistant entity
    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - atmos.settings
